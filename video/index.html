<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Sora";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url("assets/fonts/Sora.woff2") format("woff2");
      }
      @font-face {
        font-family: "Manrope";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url("assets/fonts/Manrope.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #faf7ff;
        font-family: "Manrope", system-ui, sans-serif;
      }
      :root {
        --ink: #221b3a;
        --ink-soft: #5b5470;
        --mint: #8ef0c9;
        --mint-d: #34c98a;
        --blush: #ffc7e0;
        --blush-d: #f06fab;
        --lav: #c9b6ff;
        --lav-d: #8b5cf6;
        --peach: #ffd6a8;
        --peach-d: #f59e42;
        --sky: #aee0ff;
        --sky-d: #38a8e6;
      }

      /* ---------- background ---------- */
      #bg {
        width: 1920px; height: 1080px; position: absolute; inset: 0;
        background:
          radial-gradient(1200px 900px at 78% 18%, #fff0f7 0%, rgba(255,240,247,0) 60%),
          radial-gradient(1100px 900px at 14% 86%, #eafff6 0%, rgba(234,255,246,0) 60%),
          linear-gradient(135deg, #f7f2ff 0%, #fdf4fb 45%, #f1fbff 100%);
        overflow: hidden;
      }
      .blob {
        position: absolute; border-radius: 50%; filter: blur(34px); opacity: 0.5;
      }
      .b1 { width: 760px; height: 760px; left: -160px; top: -180px;
        background: radial-gradient(circle at 30% 30%, var(--lav), transparent 68%);
        animation: float1 16s ease-in-out infinite; }
      .b2 { width: 680px; height: 680px; right: -140px; top: 40px;
        background: radial-gradient(circle at 60% 40%, var(--blush), transparent 68%);
        animation: float2 19s ease-in-out infinite; }
      .b3 { width: 720px; height: 720px; left: 36%; bottom: -260px;
        background: radial-gradient(circle at 50% 50%, var(--mint), transparent 68%);
        animation: float3 22s ease-in-out infinite; }
      .b4 { width: 460px; height: 460px; right: 22%; bottom: 8%;
        background: radial-gradient(circle at 50% 50%, var(--sky), transparent 68%);
        animation: float1 18s ease-in-out infinite reverse; }
      @keyframes float1 { 0%,100% { transform: translate(0,0) scale(1);} 50% { transform: translate(60px,40px) scale(1.08);} }
      @keyframes float2 { 0%,100% { transform: translate(0,0) scale(1);} 50% { transform: translate(-50px,60px) scale(1.1);} }
      @keyframes float3 { 0%,100% { transform: translate(0,0) scale(1);} 50% { transform: translate(40px,-50px) scale(1.06);} }
      #grid {
        position: absolute; inset: 0; opacity: 0.05;
        background-image:
          linear-gradient(var(--ink) 1px, transparent 1px),
          linear-gradient(90deg, var(--ink) 1px, transparent 1px);
        background-size: 64px 64px;
        -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 40%, transparent 78%);
        mask-image: radial-gradient(circle at 50% 50%, #000 40%, transparent 78%);
      }

      /* ---------- agenda ---------- */
      #stage {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 90px 150px;
      }
      .eyebrow {
        display: inline-flex; align-items: center; gap: 14px;
        font-family: "Sora"; font-weight: 700; letter-spacing: 0.34em;
        font-size: 26px; color: var(--lav-d); text-transform: uppercase;
      }
      .eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--mint-d); }
      #title {
        font-family: "Sora"; font-weight: 800; color: var(--ink); text-align: center;
        font-size: 92px; line-height: 1.02; letter-spacing: -0.02em; margin: 22px 0 8px;
      }
      #rule {
        height: 7px; width: 360px; border-radius: 999px; transform-origin: center;
        background: linear-gradient(90deg, var(--lav-d), var(--blush-d), var(--mint-d));
        margin-bottom: 50px;
      }
      .list { display: flex; flex-direction: column; gap: 22px; width: 1080px; }
      .item {
        display: flex; align-items: center; gap: 30px;
        background: rgba(255,255,255,0.82); border: 2px solid rgba(255,255,255,0.9);
        border-radius: 22px; padding: 20px 32px;
        box-shadow: 0 16px 40px rgba(34,27,58,0.09);
      }
      .item .badge {
        flex: 0 0 auto; width: 72px; height: 72px; border-radius: 18px;
        display: grid; place-items: center; color: #fff;
        font-family: "Sora"; font-weight: 800; font-size: 34px;
        box-shadow: 0 12px 26px rgba(34,27,58,0.16);
      }
      .item .topic {
        font-family: "Sora"; font-weight: 700; font-size: 46px; color: var(--ink);
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12"
         data-width="1920" data-height="1080">

      <!-- audio: original synthesized chillhop beat -->
      <audio id="beat" class="clip" src="assets/beat.wav" data-start="0" data-duration="12"
             data-track-index="0" data-volume="0.9"></audio>

      <!-- persistent background -->
      <div id="bg" class="clip" data-start="0" data-duration="12" data-track-index="1">
        <div class="blob b1" data-layout-allow-overflow></div>
        <div class="blob b2" data-layout-allow-overflow></div>
        <div class="blob b3" data-layout-allow-overflow></div>
        <div class="blob b4" data-layout-allow-overflow></div>
        <div id="grid"></div>
      </div>

      <!-- agenda -->
      <div id="stage" class="clip" data-start="0" data-duration="12" data-track-index="2">
        <div class="eyebrow" id="eyebrow"><span class="dot"></span>What We'll Cover</div>
        <h1 id="title">Basics of Sectoral Rotation</h1>
        <div id="rule"></div>
        <div class="list">
          <div class="item">
            <span class="badge" style="background:linear-gradient(135deg,var(--lav-d),var(--sky-d))">01</span>
            <span class="topic">P/E &amp; P/B Valuation</span>
          </div>
          <div class="item">
            <span class="badge" style="background:linear-gradient(135deg,var(--blush-d),var(--peach-d))">02</span>
            <span class="topic">Reversion to the Mean</span>
          </div>
          <div class="item">
            <span class="badge" style="background:linear-gradient(135deg,var(--mint-d),var(--sky-d))">03</span>
            <span class="topic">Finding Opportunities</span>
          </div>
          <div class="item">
            <span class="badge" style="background:linear-gradient(135deg,var(--sky-d),var(--lav-d))">04</span>
            <span class="topic">Backtesting Your Entry</span>
          </div>
          <div class="item">
            <span class="badge" style="background:linear-gradient(135deg,var(--peach-d),var(--blush-d))">05</span>
            <span class="topic">Advanced Features</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // header
      tl.from("#eyebrow", { opacity: 0, y: -28, duration: 0.5, ease: "power3.out" }, 0.2);
      tl.from("#title", { opacity: 0, y: 48, scale: 0.96, duration: 0.7, ease: "power3.out" }, 0.45);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 1.1);

      // agenda items pop in one per beat-ish, accumulating into the full list
      const items = gsap.utils.toArray(".item");
      const START = 2.0, STEP = 1.1;
      items.forEach((el, i) => {
        const t = START + i * STEP;
        tl.from(el, { opacity: 0, x: -60, duration: 0.5, ease: "power3.out" }, t);
        tl.from(el.querySelector(".badge"),
          { scale: 0.3, rotation: -18, duration: 0.5, ease: "back.out(2.2)" }, t);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
