<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SectorScope — Offline</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<meta name="theme-color" content="#eef1f8">
<style>
  :root{--bg:#eef1f8;--bg2:#fff;--txt:#0f172a;--sub:#475a7a;--bdr:rgba(0,0,0,.08);--acc:#059669}
  @media (prefers-color-scheme:dark){
    :root{--bg:#080b12;--bg2:#0d1120;--txt:#dce5f5;--sub:#7a8fb0;--bdr:rgba(255,255,255,.07);--acc:#69f0ae}
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;
       background:var(--bg);color:var(--txt);
       font-family:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  .card{background:var(--bg2);border:1px solid var(--bdr);border-radius:14px;
        padding:32px 28px;max-width:380px}
  h1{font-size:20px;font-weight:600;margin-bottom:8px;letter-spacing:-.01em}
  p{color:var(--sub);font-size:15px;line-height:1.5;margin-bottom:22px}
  button{background:var(--acc);color:var(--bg2);border:0;border-radius:8px;
         padding:10px 20px;font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>SectorScope needs a connection to pull the latest index data from NSE.</p>
    <button type="button" onclick="location.replace('/')">Retry</button>
  </div>
</body>
</html>
